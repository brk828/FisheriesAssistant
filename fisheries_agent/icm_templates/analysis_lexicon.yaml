toxicity-doseresponse:     {group: toxicology, data: dose-response, patterns: ['\bLC50\b', '\bLD50\b', 'probit', 'dose[- ]response', 'acute toxicity', 'bioassay']}
survival-time-to-event:    {group: survival, data: time-to-event, patterns: ['Kaplan[- ]Meier', 'survival analysis', 'hazard', 'Cox proportional']}
spatial-gis:               {group: spatial, data: spatial, patterns: ['\bGIS\b', 'spatial autocorrelation', 'kriging', 'geostatistic', 'species distribution model', 'MaxEnt']}
